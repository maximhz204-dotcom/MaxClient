name: Build MAX CLIENT
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip MaxClient-src.zip
      - name: Use Forge 2859
        run: sed -i 's/14.23.5.2860/14.23.5.2859/' MaxClient/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.9
          cache-disabled: true
      - name: Build
        working-directory: MaxClient
        run: |
          gradle wrapper --gradle-version 4.9
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MaxClient
          path: MaxClient/build/libs/*.jar
